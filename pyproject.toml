[project]
name = "kata"
version = "0.1.0"
description = "Code Kata Python Template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
